<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>golda-messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: '#00ff66',
                        neonDark: '#00cc52',
                        darkBg: '#0b0f0d',
                        panelBg: '#121815',
                        cardBg: '#1a2420'
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-glow { box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
        .neon-border { border: 1px solid rgba(0, 255, 102, 0.4); }
        .neon-border:focus { border-color: #00ff66; outline: none; box-shadow: 0 0 10px rgba(0, 255, 102, 0.5); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f0d; }
        ::-webkit-scrollbar-thumb { background: #00ff6655; border-radius: 3px; }
        #debug-log {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            color: #00ff66;
            font-size: 10px;
            padding: 8px;
            max-height: 120px;
            overflow-y: auto;
            z-index: 9999;
            font-family: monospace;
            border-top: 1px solid #00ff66;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 h-screen flex flex-col overflow-hidden font-sans">

    <div id="debug-log">🔍 Диагностика...</div>

    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-darkBg/95 backdrop-blur-md">
        <div class="bg-panelBg p-8 rounded-2xl neon-border neon-glow w-full max-w-md mx-4">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-neon tracking-wider"><i class="fa-solid fa-bolt mr-2"></i>GOLDA-MESSENGER</h1>
                <p class="text-gray-400 text-sm mt-1">Неоновый защищенный мессенджер</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div id="username-field" class="hidden">
                    <label class="block text-xs uppercase tracking-wider text-neon mb-1">Юзернейм</label>
                    <input type="text" id="username-input" placeholder="например: gold_user" class="w-full bg-darkBg text-gray-100 px-4 py-3 rounded-xl neon-border">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-neon mb-1">Эл. почта</label>
                    <input type="email" id="email-input" required placeholder="user@example.com" class="w-full bg-darkBg text-gray-100 px-4 py-3 rounded-xl neon-border">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-neon mb-1">Пароль</label>
                    <input type="password" id="password-input" required placeholder="••••••••" class="w-full bg-darkBg text-gray-100 px-4 py-3 rounded-xl neon-border">
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-neon text-darkBg font-bold py-3 rounded-xl hover:bg-neonDark transition shadow-lg shadow-neon/20 mt-2">
                    Войти
                </button>
            </form>

            <div class="text-center mt-6">
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-sm text-gray-400 hover:text-neon transition">
                    Нет аккаунта? Зарегистрироваться
                </button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden flex h-screen w-full overflow-hidden relative">
        <div id="sidebar" class="w-full md:w-80 bg-panelBg border-r border-gray-800 flex flex-col justify-between absolute md:relative inset-y-0 left-0 z-30 transition-transform duration-300">
            <div>
                <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="openProfileModal()">
                        <img id="my-avatar" src="" class="w-11 h-11 rounded-full neon-border object-cover bg-darkBg" alt="Avatar">
                        <div>
                            <div class="flex items-center space-x-1">
                                <h3 id="my-username" class="font-bold text-neon text-sm truncate max-w-[100px]">...</h3>
                                <span id="my-verified-badge" class="hidden text-blue-400 text-xs"><i class="fa-solid fa-circle-check"></i></span>
                            </div>
                            <span class="text-xs text-gray-400">В сети</span>
                        </div>
                    </div>
                    <div class="flex space-x-1 items-center">
                        <button id="admin-panel-btn" onclick="openAdminPanel()" title="Админ панель" class="hidden text-neon hover:text-white p-2 transition"><i class="fa-solid fa-shield-halved text-lg"></i></button>
                        <button onclick="openGroupModal()" title="Создать группу" class="text-gray-400 hover:text-neon p-2 transition"><i class="fa-solid fa-users-rectangle text-lg"></i></button>
                        <button onclick="openProfileModal()" title="Профиль" class="text-gray-400 hover:text-neon p-2 transition"><i class="fa-solid fa-gear text-lg"></i></button>
                        <button onclick="toggleSidebar()" title="Закрыть меню" class="text-gray-400 hover:text-neon p-2 transition md:hidden"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                </div>

                <div class="p-3">
                    <input type="text" id="search-users" oninput="filterChats()" placeholder="🔍 Поиск по юзернейму..." class="w-full bg-darkBg text-sm text-gray-200 px-3 py-2 rounded-lg neon-border">
                </div>

                <div id="chats-list" class="overflow-y-auto h-[calc(100vh-140px)] px-2 space-y-1"></div>
            </div>

            <div class="p-3 border-t border-gray-800">
                <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 bg-red-950/30 text-red-400 border border-red-900/50 py-2 rounded-xl hover:bg-red-900/40 transition text-sm">
                    <i class="fa-solid fa-right-from-bracket"></i> <span>Выйти</span>
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-darkBg h-full w-full">
            <div id="no-chat-selected" class="flex-1 flex flex-col items-center justify-center text-gray-500 p-4 text-center">
                <button onclick="toggleSidebar()" class="md:hidden mb-4 bg-cardBg border border-neon/40 text-neon px-4 py-2 rounded-xl text-sm font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-bars"></i> <span>Открыть список чатов</span>
                </button>
                <i class="fa-solid fa-comments text-6xl text-neon/20 mb-4 animate-bounce"></i>
                <p class="text-lg">Введите юзернейм в поиск, чтобы найти собеседника</p>
            </div>

            <div id="active-chat-container" class="hidden flex-1 flex flex-col h-full">
                <div class="p-4 bg-panelBg border-b border-gray-800 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <button onclick="toggleSidebar()" class="md:hidden text-neon hover:text-white mr-1 text-lg p-1"><i class="fa-solid fa-arrow-left"></i></button>
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="openTargetProfile()">
                            <img id="chat-header-avatar" src="" class="w-10 h-10 rounded-full neon-border object-cover bg-darkBg">
                            <div>
                                <div class="flex items-center space-x-1">
                                    <h3 id="chat-header-name" class="font-bold text-gray-100">Имя</h3>
                                    <span id="chat-header-verified" class="hidden text-blue-400 text-xs"><i class="fa-solid fa-circle-check"></i></span>
                                </div>
                                <span id="chat-header-status" class="text-xs text-neon">в сети</span>
                            </div>
                        </div>
                    </div>
                    <div class="relative">
                        <button onclick="toggleChatMenu()" class="text-gray-400 hover:text-neon p-2 transition"><i class="fa-solid fa-ellipsis-vertical text-xl"></i></button>
                        <div id="chat-dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-panelBg neon-border rounded-xl shadow-xl z-20 overflow-hidden">
                            <button onclick="clearCurrentChat()" class="w-full text-left px-4 py-3 text-sm text-gray-300 hover:bg-cardBg hover:text-neon transition"><i class="fa-solid fa-trash mr-2"></i> Удалить чат</button>
                            <button onclick="blockCurrentUser()" id="block-menu-btn" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-cardBg transition"><i class="fa-solid fa-ban mr-2"></i> Заблокировать</button>
                        </div>
                    </div>
                </div>

                <div id="messages-list" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

                <form id="message-form" class="p-4 bg-panelBg border-t border-gray-800 flex items-center space-x-3">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Напишите сообщение..." class="flex-1 bg-darkBg text-gray-100 px-4 py-3 rounded-xl neon-border">
                    <button type="submit" class="bg-neon text-darkBg px-5 py-3 rounded-xl font-bold hover:bg-neonDark transition shadow-lg shadow-neon/20">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-panelBg p-6 rounded-2xl neon-border w-full max-w-md mx-4 relative">
            <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-neon"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 class="text-xl font-bold text-neon mb-4">Профиль пользователя</h2>
            <div class="space-y-4">
                <div class="flex flex-col items-center mb-4">
                    <img id="edit-avatar-preview" src="" class="w-20 h-20 rounded-full neon-border object-cover mb-3 bg-darkBg">
                    <label class="cursor-pointer bg-cardBg border border-neon/50 text-neon px-4 py-2 rounded-xl text-xs font-bold hover:bg-darkBg transition">
                        <i class="fa-solid fa-image mr-2"></i> Выбрать из галереи
                        <input type="file" id="avatar-file-input" accept="image/*" class="hidden" onchange="handleGalleryUpload(event)">
                    </label>
                </div>
                <div><label class="block text-xs text-neon mb-1">Имя</label><input type="text" id="edit-name" class="w-full bg-darkBg text-gray-100 px-3 py-2 rounded-lg neon-border text-sm"></div>
                <div><label class="block text-xs text-neon mb-1">Юзернейм</label><input type="text" id="edit-username" class="w-full bg-darkBg text-gray-100 px-3 py-2 rounded-lg neon-border text-sm"></div>
                <div><label class="block text-xs text-neon mb-1">О себе</label><textarea id="edit-bio" rows="3" class="w-full bg-darkBg text-gray-100 px-3 py-2 rounded-lg neon-border text-sm"></textarea></div>
                <button onclick="saveProfile()" class="w-full bg-neon text-darkBg font-bold py-2.5 rounded-xl hover:bg-neonDark transition">Сохранить</button>
                <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 bg-red-950/30 text-red-400 border border-red-900/50 py-2.5 rounded-xl hover:bg-red-900/40 transition text-sm font-bold">
                    <i class="fa-solid fa-right-from-bracket"></i> <span>Выйти из аккаунта</span>
                </button>
            </div>
        </div>
    </div>

    <div id="target-profile-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-panelBg p-6 rounded-2xl neon-border w-full max-w-sm mx-4 text-center relative">
            <button onclick="closeTargetProfile()" class="absolute top-4 right-4 text-gray-400 hover:text-neon"><i class="fa-solid fa-xmark text-xl"></i></button>
            <img id="tp-avatar" src="" class="w-24 h-24 rounded-full neon-border object-cover mx-auto mb-4 bg-darkBg">
            <div class="flex items-center justify-center space-x-1 mb-1">
                <h3 id="tp-username" class="text-xl font-bold text-neon">@username</h3>
                <span id="tp-verified" class="hidden text-blue-400"><i class="fa-solid fa-circle-check"></i></span>
            </div>
            <p id="tp-email" class="text-xs text-gray-400 mb-3">email@example.com</p>
            <div class="bg-darkBg p-3 rounded-xl neon-border text-sm text-gray-300 mb-4 text-left">
                <span class="text-xs text-neon block mb-1 font-bold">О себе:</span>
                <p id="tp-bio">...</p>
            </div>
        </div>
    </div>

    <div id="group-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-panelBg p-6 rounded-2xl neon-border w-full max-w-md mx-4 relative">
            <button onclick="closeGroupModal()" class="absolute top-4 right-4 text-gray-400 hover:text-neon"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 class="text-xl font-bold text-neon mb-4">Создать группу</h2>
            <div class="space-y-4">
                <div><label class="block text-xs text-neon mb-1">Название</label><input type="text" id="group-name-input" class="w-full bg-darkBg text-gray-100 px-3 py-2 rounded-lg neon-border text-sm"></div>
                <div><label class="block text-xs text-neon mb-2">Участники</label><div id="group-users-list" class="max-h-48 overflow-y-auto space-y-2 bg-darkBg p-3 rounded-lg neon-border"></div></div>
                <button onclick="createGroup()" class="w-full bg-neon text-darkBg font-bold py-2.5 rounded-xl hover:bg-neonDark transition">Создать</button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="bg-panelBg p-6 rounded-2xl neon-border w-full max-w-4xl mx-4 relative max-h-[85vh] flex flex-col">
            <button onclick="closeAdminPanel()" class="absolute top-4 right-4 text-gray-400 hover:text-neon p-2"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <h2 class="text-2xl font-bold text-neon mb-4">Админ панель</h2>
            <div class="overflow-y-auto flex-1 neon-border rounded-xl mb-4">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-darkBg text-neon text-xs uppercase border-b border-gray-800">
                            <th class="p-3">Юзернейм</th><th class="p-3">Почта</th><th class="p-3">Статус</th><th class="p-3 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-table" class="text-sm divide-y divide-gray-800"></tbody>
                </table>
            </div>
            <button onclick="closeAdminPanel()" class="w-full bg-cardBg hover:bg-darkBg text-gray-300 font-bold py-3 rounded-xl border border-gray-700 transition">Закрыть</button>
        </div>
    </div>

    <script>
        function debug(msg) {
            const log = document.getElementById('debug-log');
            log.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        const SUPABASE_URL = 'https://dbyuboaxorfudywmlrvi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hG8WV5dG4gMpUu7zN4-ntQ_T1dYrFXJ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;
        let allUsers = [];
        let allGroups = [];
        let currentChat = null;
        let messagesSubscription = null;
        let isSignUpMode = false;
        let tempNewAvatarBase64 = null;

        window.addEventListener('DOMContentLoaded', async () => {
            debug('Страница загружена');
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    debug('Сессия найдена');
                    currentUser = session.user;
                    await fetchOrCreateMyProfile();
                    if (userProfile?.is_banned) {
                        alert('Ваш аккаунт заблокирован.');
                        await supabaseClient.auth.signOut();
                        location.reload();
                        return;
                    }
                    await ensureOfficialChannel();
                    showApp();
                } else {
                    debug('Сессии нет');
                    showAuth();
                }
            } catch (err) {
                debug('Ошибка: ' + err.message);
                alert('Ошибка загрузки: ' + err.message);
            }
        });

        function showAuth() { 
            document.getElementById('auth-screen').classList.remove('hidden'); 
            document.getElementById('app-screen').classList.add('hidden'); 
            document.getElementById('app-screen').classList.remove('flex'); 
        }
        
        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('flex');
            
            const username = userProfile?.username || 'user';
            const avatar = userProfile?.avatar_url || '';
            
            document.getElementById('my-avatar').src = avatar;
            document.getElementById('my-username').textContent = '@' + username;
            
            if (userProfile?.is_verified) {
                document.getElementById('my-verified-badge').classList.remove('hidden');
            }

            const emailLower = (currentUser?.email || '').toLowerCase();
            if (userProfile?.role === 'admin' || emailLower === 'levshlapa919@gmail.com') {
                document.getElementById('admin-panel-btn').classList.remove('hidden');
            }

            updateStatus('online');
            loadAppData();
            setupRealtime();
        }

        async function ensureOfficialChannel() {
            const channelName = 'golda messenger new';
            let { data: channel } = await supabaseClient.from('groups').select('*').eq('name', channelName).single();
            
            if (!channel) {
                const { data: newChan } = await supabaseClient.from('groups').insert([{ name: channelName, created_by: currentUser.id }]).select().single();
                channel = newChan;
            }

            if (channel) {
                const { data: membership } = await supabaseClient.from('group_members').select('*').eq('group_id', channel.id).eq('user_id', currentUser.id).single();
                if (!membership) {
                    await supabaseClient.from('group_members').insert([{ group_id: channel.id, user_id: currentUser.id }]);
                }
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-btn').textContent = isSignUpMode ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('auth-toggle-btn').textContent = isSignUpMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            document.getElementById('username-field').classList.toggle('hidden', !isSignUpMode);
        }

        document.getElementById('auth-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (!email || !password) {
                alert('Введите email и пароль!');
                return;
            }

            if (isSignUpMode) {
                const username = document.getElementById('username-input').value.trim();
                if (!username) { alert('Введите юзернейм!'); return; }

                try {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) { 
                        alert('Ошибка регистрации: ' + error.message); 
                        return; 
                    }

                    currentUser = data.user;
                    if (currentUser) {
                        const role = (email.toLowerCase() === 'levshlapa919@gmail.com') ? 'admin' : 'user';
                        const is_verified = (email.toLowerCase() === 'levshlapa919@gmail.com');
                        
                        const { error: upsertError } = await supabaseClient.from('profiles').upsert({
                            id: currentUser.id,
                            username: username,
                            email: email,
                            role: role,
                            is_verified: is_verified
                        });
                        
                        if (upsertError) {
                            console.warn("Не удалось сохранить профиль:", upsertError);
                        }
                    }
                    alert('Регистрация успешна!');
                    location.reload();
                } catch (err) {
                    alert('Ошибка: ' + err.message);
                }
            } else {
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) { 
                        alert('Ошибка входа: ' + error.message); 
                        return; 
                    }
                    location.reload();
                } catch (err) {
                    alert('Ошибка: ' + err.message);
                }
            }
        });

        async function fetchOrCreateMyProfile() {
            let { data, error: fetchError } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            const emailLower = (currentUser.email || '').toLowerCase();
            const isAdmin = emailLower === 'levshlapa919@gmail.com';
            const role = isAdmin ? 'admin' : 'user';
            const is_verified = isAdmin;

            if (!data) {
                const defaultUsername = currentUser.email ? currentUser.email.split('@')[0] : 'user_' + currentUser.id.slice(0, 6);
                
                const { data: newProf, error: insertError } = await supabaseClient
                    .from('profiles')
                    .upsert({
                        id: currentUser.id,
                        username: defaultUsername,
                        email: currentUser.email,
                        role: role,
                        is_verified: is_verified
                    })
                    .select()
                    .single();
                
                if (insertError) {
                    console.error("Ошибка БД:", insertError);
                    userProfile = {
                        id: currentUser.id,
                        username: defaultUsername,
                        email: currentUser.email,
                        role: role,
                        is_verified: is_verified,
                        avatar_url: '',
                        bio: '',
                        status: 'online'
                    };
                } else {
                    userProfile = newProf;
                }
            } else {
                userProfile = data;
                if (isAdmin && (userProfile.role !== 'admin' || !userProfile.is_verified)) {
                    await supabaseClient.from('profiles').update({ role: 'admin', is_verified: true }).eq('id', currentUser.id);
                    userProfile.role = 'admin';
                    userProfile.is_verified = true;
                }
            }
        }

        async function logout() { 
            if (currentUser) await updateStatus('offline'); 
            await supabaseClient.auth.signOut(); 
            location.reload(); 
        }

        async function updateStatus(status) { 
            if (!currentUser) return; 
            await supabaseClient.from('profiles').update({ status }).eq('id', currentUser.id); 
        }

        async function loadAppData() {
            const { data: myGroups } = await supabaseClient.from('group_members').select('group_id').eq('user_id', currentUser.id);
            const groupIds = myGroups?.map(g => g.group_id) || [];
            
            if (groupIds.length > 0) {
                const { data: groups } = await supabaseClient.from('groups').select('*').in('id', groupIds);
                allGroups = groups || [];
            }
            
            allUsers = [];
            renderChatsList();
        }

        function renderChatsList(filter = '') {
            const listContainer = document.getElementById('chats-list');
            listContainer.innerHTML = '';
            const query = filter.toLowerCase().replace('@', '').trim();

            allGroups.filter(g => g.name.toLowerCase().includes(query)).forEach(g => {
                const isChannel = g.name === 'golda messenger new';
                const div = document.createElement('div');
                div.className = `p-3 rounded-xl cursor-pointer flex items-center space-x-3 transition hover:bg-cardBg ${currentChat?.id === g.id ? 'bg-cardBg neon-border' : ''}`;
                div.onclick = () => {
                    selectChat({ id: g.id, type: 'group', name: g.name, avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=' + g.name, isChannel });
                    if (window.innerWidth < 768) toggleSidebar();
                };
                div.innerHTML = `
                    <div class="relative">
                        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${g.name}" class="w-11 h-11 rounded-full neon-border object-cover bg-darkBg">
                        ${isChannel ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-neon rounded-full border-2 border-panelBg"></span>' : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-100 truncate text-sm flex items-center space-x-1">
                            <span>${g.name}</span>
                            ${isChannel ? '<span class="text-blue-400 text-xs"><i class="fa-solid fa-circle-check"></i></span>' : ''}
                        </h4>
                        <p class="text-xs text-neon">${isChannel ? 'Официальный канал' : 'Группа'}</p>
                    </div>`;
                listContainer.appendChild(div);
            });

            if (query.length > 0) {
                supabaseClient.from('profiles')
                    .select('*')
                    .neq('id', currentUser.id)
                    .ilike('username', `%${query}%`)
                    .then(({ data: users }) => {
                        const foundUsers = users || [];
                        foundUsers.filter(u => !u.is_banned).forEach(u => {
                            const statusColor = u.status === 'online' ? 'bg-neon' : u.status === 'in_chat' ? 'bg-yellow-400' : 'bg-gray-500';
                            const div = document.createElement('div');
                            div.className = `p-3 rounded-xl cursor-pointer flex items-center space-x-3 transition hover:bg-cardBg ${currentChat?.id === u.id ? 'bg-cardBg neon-border' : ''}`;
                            div.onclick = () => {
                                selectChat({ id: u.id, type: 'user', name: u.username, avatar: u.avatar_url, status: u.status, bio: u.bio, email: u.email, is_verified: u.is_verified });
                                if (window.innerWidth < 768) toggleSidebar();
                            };
                            div.innerHTML = `
                                <div class="relative">
                                    <img src="${u.avatar_url || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + u.username}" class="w-11 h-11 rounded-full neon-border object-cover bg-darkBg">
                                    <span class="absolute bottom-0 right-0 w-3 h-3 ${statusColor} rounded-full border-2 border-panelBg"></span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center space-x-1">
                                        <h4 class="font-bold text-gray-100 truncate text-sm">@${u.username}</h4>
                                        ${u.is_verified ? '<span class="text-blue-400 text-xs"><i class="fa-solid fa-circle-check"></i></span>' : ''}
                                    </div>
                                    <p class="text-xs text-gray-400">${u.status || 'офлайн'}</p>
                                </div>`;
                            listContainer.appendChild(div);
                        });

                        if (foundUsers.length === 0) {
                            listContainer.innerHTML += `<div class="p-4 text-center text-gray-500 text-xs">Пользователь "${query}" не найден</div>`;
                        }
                    });
            } else {
                if (allGroups.length === 0) {
                    listContainer.innerHTML = `<div class="p-4 text-center text-gray-500 text-xs mt-4">Введите юзернейм в поиск, чтобы найти пользователя</div>`;
                }
            }
        }

        function filterChats() { renderChatsList(document.getElementById('search-users').value); }

        async function selectChat(chatInfo) {
            currentChat = chatInfo;
            document.getElementById('no-chat-selected').classList.add('hidden');
            document.getElementById('active-chat-container').classList.remove('hidden');
            document.getElementById('chat-header-name').textContent = chatInfo.type === 'user' ? '@' + chatInfo.name : chatInfo.name;
            document.getElementById('chat-header-avatar').src = chatInfo.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + chatInfo.name;

            const verifiedBadge = document.getElementById('chat-header-verified');
            if (chatInfo.is_verified || chatInfo.name === 'golda messenger new') {
                verifiedBadge.classList.remove('hidden');
            } else {
                verifiedBadge.classList.add('hidden');
            }

            const messageForm = document.getElementById('message-form');
            if (chatInfo.name === 'golda messenger new' && userProfile?.role !== 'admin') {
                messageForm.style.display = 'none';
            } else {
                messageForm.style.display = 'flex';
            }

            debug('Чат выбран: ' + chatInfo.type + ' ID: ' + chatInfo.id);
            await updateStatus('in_chat');
            loadMessages();
        }

        async function loadMessages() {
            const messagesList = document.getElementById('messages-list');
            messagesList.innerHTML = '';
            
            debug('Загрузка сообщений для чата: ' + currentChat.id);
            
            let query = supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
            
            if (currentChat.type === 'user') {
                // ИСПРАВЛЕНО: Правильный синтаксис OR с and()
                query = query.or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChat.id}),and(sender_id.eq.${currentChat.id},receiver_id.eq.${currentUser.id})`);
                debug('Запрос: or(and(sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + currentChat.id + '),and(sender_id.eq.' + currentChat.id + ',receiver_id.eq.' + currentUser.id + '))');
            } else {
                query = query.eq('group_id', currentChat.id);
            }
            
            const { data, error } = await query;
            
            if (error) {
                debug('Ошибка загрузки: ' + error.message);
                messagesList.innerHTML = `<div class="text-center text-red-400 p-4">Ошибка: ${error.message}</div>`;
                return;
            }
            
            debug('Найдено сообщений: ' + (data ? data.length : 0));
            
            if (data) {
                const senderIds = [...new Set(data.map(m => m.sender_id))];
                const { data: profiles } = await supabaseClient.from('profiles').select('id, username, avatar_url, is_verified').in('id', senderIds);
                const profilesMap = {};
                if (profiles) profiles.forEach(p => profilesMap[p.id] = p);
                
                data.forEach(msg => {
                    msg.profiles = profilesMap[msg.sender_id] || null;
                    appendMessageUI(msg);
                });
            }
        }

        function appendMessageUI(msg) {
            const messagesList = document.getElementById('messages-list');
            const isMe = msg.sender_id === currentUser.id;
            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-3`;
            
            const sender = msg.profiles;
            const verifiedHtml = sender?.is_verified ? '<span class="text-blue-400 text-xs ml-1"><i class="fa-solid fa-circle-check"></i></span>' : '';

            div.innerHTML = `
                <div class="max-w-[70%] bg-${isMe ? 'cardBg border border-neon/30' : 'panelBg'} rounded-2xl p-3 shadow-md">
                    ${!isMe && currentChat.type === 'group' ? `<div class="flex items-center mb-1"><span class="text-xs text-neon font-bold">@${sender?.username || 'пользователь'}</span>${verifiedHtml}</div>` : ''}
                    <p class="text-sm text-gray-100 break-words">${msg.content}</p>
                </div>`;
            messagesList.appendChild(div);
            messagesList.scrollTop = messagesList.scrollHeight;
        }

        document.getElementById('message-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !currentChat) return;

            if (currentChat.name === 'golda messenger new' && userProfile?.role !== 'admin') {
                alert('Только администратор может публиковать новости в канале!');
                return;
            }

            const payload = { sender_id: currentUser.id, content };
            if (currentChat.type === 'user') {
                payload.receiver_id = currentChat.id;
                debug('Отправка ЛС: от ' + currentUser.id + ' к ' + currentChat.id);
            } else {
                payload.group_id = currentChat.id;
                debug('Отправка в группу: ' + currentChat.id);
            }
            
            const { data, error } = await supabaseClient.from('messages').insert([payload]).select();
            
            if (error) {
                debug('Ошибка отправки: ' + error.message);
                alert('Ошибка отправки: ' + error.message);
            } else {
                debug('Сообщение отправлено успешно!');
                input.value = '';
                if (data && data[0]) {
                    data[0].profiles = { username: userProfile.username, avatar_url: userProfile.avatar_url, is_verified: userProfile.is_verified };
                    appendMessageUI(data[0]);
                }
            }
        });

        function setupRealtime() {
            debug('Настройка realtime...');
            if (messagesSubscription) supabaseClient.removeChannel(messagesSubscription);
            messagesSubscription = supabaseClient.channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    debug('Realtime: новое сообщение от ' + payload.new.sender_id);
                    if (currentChat && (payload.new.sender_id === currentChat.id || payload.new.receiver_id === currentChat.id || payload.new.group_id === currentChat.id)) {
                        debug('Realtime: сообщение для текущего чата');
                        supabaseClient.from('profiles').select('username, avatar_url, is_verified').eq('id', payload.new.sender_id).single().then(({data}) => {
                            payload.new.profiles = data;
                            appendMessageUI(payload.new);
                        });
                    } else {
                        debug('Realtime: сообщение НЕ для текущего чата');
                    }
                })
                .subscribe((status) => {
                    debug('Realtime статус: ' + status);
                });
        }

        function toggleChatMenu() { document.getElementById('chat-dropdown-menu').classList.toggle('hidden'); }
        async function clearCurrentChat() {
            toggleChatMenu();
            if (!confirm('Очистить чат?')) return;
            if (currentChat.type === 'user') {
                await supabaseClient.from('messages').delete().or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChat.id}),and(sender_id.eq.${currentChat.id},receiver_id.eq.${currentUser.id})`);
            } else {
                await supabaseClient.from('messages').delete().eq('group_id', currentChat.id);
            }
            loadMessages();
        }
        async function blockCurrentUser() {
            toggleChatMenu();
            if (currentChat.type !== 'user') return;
            await supabaseClient.from('blocks').insert([{ blocker_id: currentUser.id, blocked_id: currentChat.id }]);
            alert('Пользователь заблокирован');
            location.reload();
        }

        function handleGalleryUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                tempNewAvatarBase64 = event.target.result;
                document.getElementById('edit-avatar-preview').src = tempNewAvatarBase64;
            };
            reader.readAsDataURL(file);
        }

        function openProfileModal() {
            if (!userProfile) return;
            tempNewAvatarBase64 = null;
            document.getElementById('edit-avatar-preview').src = userProfile.avatar_url || '';
            document.getElementById('edit-name').value = userProfile.username || '';
            document.getElementById('edit-username').value = userProfile.username || '';
            document.getElementById('edit-bio').value = userProfile.bio || '';
            document.getElementById('profile-modal').classList.remove('hidden');
            document.getElementById('profile-modal').classList.add('flex');
        }
        function closeProfileModal() { 
            document.getElementById('profile-modal').classList.add('hidden'); 
            document.getElementById('profile-modal').classList.remove('flex'); 
        }

        async function saveProfile() {
            if (!userProfile) return;
            const username = document.getElementById('edit-username').value.trim();
            const bio = document.getElementById('edit-bio').value;
            let avatar_url = userProfile.avatar_url;
            if (tempNewAvatarBase64) avatar_url = tempNewAvatarBase64;

            const { error } = await supabaseClient.from('profiles').update({ avatar_url, username, bio }).eq('id', currentUser.id);
            if (error) { alert('Ошибка: ' + error.message); return; }
            alert('Сохранено!');
            closeProfileModal();
            location.reload();
        }

        function openTargetProfile() {
            if (!currentChat || currentChat.type !== 'user') return;
            document.getElementById('tp-avatar').src = currentChat.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + currentChat.name;
            document.getElementById('tp-username').textContent = '@' + currentChat.name;
            document.getElementById('tp-email').textContent = currentChat.email || 'скрыто';
            document.getElementById('tp-bio').textContent = currentChat.bio || 'нет описания';
            
            const verified = document.getElementById('tp-verified');
            if (currentChat.is_verified) verified.classList.remove('hidden');
            else verified.classList.add('hidden');

            document.getElementById('target-profile-modal').classList.remove('hidden');
            document.getElementById('target-profile-modal').classList.add('flex');
        }
        function closeTargetProfile() { 
            document.getElementById('target-profile-modal').classList.add('hidden'); 
            document.getElementById('target-profile-modal').classList.remove('flex'); 
        }

        function openGroupModal() {
            const list = document.getElementById('group-users-list');
            list.innerHTML = '';
            allUsers.forEach(u => {
                list.innerHTML += `<label class="flex items-center space-x-2 text-sm text-gray-300 cursor-pointer p-1 hover:bg-cardBg rounded"><input type="checkbox" value="${u.id}" class="group-user-checkbox accent-neon"><img src="${u.avatar_url || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + u.username}" class="w-6 h-6 rounded-full bg-darkBg"><span>@${u.username}</span></label>`;
            });
            document.getElementById('group-modal').classList.remove('hidden');
            document.getElementById('group-modal').classList.add('flex');
        }
        function closeGroupModal() { 
            document.getElementById('group-modal').classList.add('hidden'); 
            document.getElementById('group-modal').classList.remove('flex'); 
        }
        
        async function createGroup() {
            const name = document.getElementById('group-name-input').value.trim();
            if (!name) return;
            const memberIds = Array.from(document.querySelectorAll('.group-user-checkbox:checked')).map(cb => cb.value);
            memberIds.push(currentUser.id);
            const { data: gData } = await supabaseClient.from('groups').insert([{ name, created_by: currentUser.id }]).select().single();
            if (gData) {
                await supabaseClient.from('group_members').insert(memberIds.map(uid => ({ group_id: gData.id, user_id: uid })));
                alert('Группа создана!');
                closeGroupModal();
                loadAppData();
            }
        }

        async function openAdminPanel() {
            const { data: users } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('admin-users-table');
            tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `
                    <tr class="hover:bg-darkBg transition">
                        <td class="p-3 text-neon flex items-center space-x-1">
                            <span>@${u.username || 'unknown'}</span>
                            ${u.is_verified ? '<span class="text-blue-400 text-xs"><i class="fa-solid fa-circle-check"></i></span>' : ''}
                        </td>
                        <td class="p-3">${u.email || 'нет'}</td>
                        <td class="p-3">${u.is_banned ? '<span class="text-red-400 font-bold">Бан</span>' : '<span class="text-green-400">Активен</span>'}</td>
                        <td class="p-3 text-right space-x-1">
                            <button onclick="toggleVerify('${u.id}', ${u.is_verified})" class="px-2 py-1 bg-blue-600/20 text-blue-400 rounded text-xs hover:bg-blue-600/30 transition">${u.is_verified ? 'Снять галочку' : 'Верифицировать'}</button>
                            <button onclick="toggleBan('${u.id}', ${u.is_banned})" class="px-2 py-1 bg-red-600/20 text-red-400 rounded text-xs hover:bg-red-600/30 transition">${u.is_banned ? 'Разбан' : 'Бан'}</button>
                        </td>
                    </tr>`;
            });
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-modal').classList.add('flex');
        }
        function closeAdminPanel() { 
            document.getElementById('admin-modal').classList.add('hidden'); 
            document.getElementById('admin-modal').classList.remove('flex'); 
        }
        async function toggleBan(uid, banned) {
            await supabaseClient.from('profiles').update({ is_banned: !banned }).eq('id', uid);
            openAdminPanel();
        }
        async function toggleVerify(uid, verified) {
            await supabaseClient.from('profiles').update({ is_verified: !verified }).eq('id', uid);
            openAdminPanel();
        }
    </script>
</body>
</html>
