<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GOLDA MESSENGER</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#04080a;--panel:#0a1611;--panel2:#0d1d15;--line:#143728;--neon:#33ff8a;--neon2:#baff3e;--txt:#e9fff3;--mut:#7fa994;--danger:#ff5470}
body.light{--bg:#f5f5f5;--panel:#fff;--panel2:#f0f0f0;--line:#ddd;--neon:#00a86b;--neon2:#00805a;--txt:#222;--mut:#888}
body.blue{--bg:#0a1628;--panel:#0f1f3d;--panel2:#142a4d;--line:#1e3a6e;--neon:#4da6ff;--neon2:#80c4ff;--txt:#e8f0ff;--mut:#7a94b8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Manrope',system-ui,sans-serif;font-size:15px;transition:background .3s}
.mono{font-family:'JetBrains Mono',monospace}.dim{color:var(--mut)}.hidden{display:none!important}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(51,255,138,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(51,255,138,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%)}
.glow{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;opacity:.5}
.g1{width:420px;height:420px;background:rgba(51,255,138,.14);top:-160px;left:-120px;animation:drift 16s ease-in-out infinite alternate}
.g2{width:380px;height:380px;background:rgba(186,255,62,.10);bottom:-180px;right:-100px;animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
.screen{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px}
.auth-wrap{width:min(430px,100%);position:relative;z-index:2}
.brand-big{font-family:'Unbounded';font-weight:900;font-size:clamp(30px,8vw,48px);letter-spacing:.02em;line-height:1}
.brand-big b{color:var(--neon);text-shadow:0 0 16px rgba(51,255,138,.55);animation:flick 6s infinite}
@keyframes flick{0%,93%,95%,100%{opacity:1}94%{opacity:.35}}
.brand-sub{font-family:'JetBrains Mono';color:var(--mut);letter-spacing:.3em;font-size:10px;margin:6px 0 20px}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.auth-card{padding:22px}
.tabs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:18px}
.tab{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-weight:700;cursor:pointer;font-family:'Manrope';font-size:13px}
.tab.on{background:var(--neon);color:#04140b}
.field{margin-bottom:14px}
.field label{display:block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;color:var(--mut);margin-bottom:6px;text-transform:uppercase}
.input,textarea.input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 13px;font:inherit;outline:none;font-size:15px}
.input:focus{border-color:var(--neon)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 16px;font:700 13px 'Manrope';cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.neon{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04140b;border:0}
.btn.danger{border-color:#5a2233;color:#ffb3c1}
.btn.small{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.wide{width:100%}
.form-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.form-ok{color:var(--neon);font-size:13px;margin-top:10px}
.app{position:relative;z-index:2;display:flex;height:100dvh}
.sidebar{width:100%;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.sb-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.logo{font-family:'Unbounded';font-weight:900;font-size:19px}
.logo b{color:var(--neon)}
.sb-head .spacer{flex:1}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.ibtn:active{background:var(--line)}
.sb-actions{display:flex;gap:6px;padding:0 14px 10px}
.sb-actions .btn{flex:1;padding:9px;font-size:12px}
.sb-label{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.2em;color:var(--mut);padding:4px 16px 6px;text-transform:uppercase;display:flex;justify-content:space-between}
.chat-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.chat-item{display:flex;gap:10px;padding:10px;border-radius:14px;cursor:pointer;position:relative;align-items:center}
.chat-item:active{background:var(--panel2)}
.chat-item.active{background:var(--panel2);border:1px solid var(--neon)}
.chat-item.pinned{border-left:3px solid var(--neon)}
.chat-item.archived{opacity:.6}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:6px}
.ci-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-family:'JetBrains Mono';font-size:10px;color:var(--mut);flex-shrink:0}
.ci-prev{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{position:absolute;right:10px;bottom:9px;min-width:19px;height:19px;border-radius:10px;background:var(--neon);color:#04140b;font:700 11px 'JetBrains Mono';display:flex;align-items:center;justify-content:center;padding:0 5px}
.ava{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-family:'Unbounded';font-weight:800;flex-shrink:0}
.ava.grp{border-radius:12px;background:linear-gradient(135deg,#134d2e,#0b2818);color:var(--neon);border:1px solid var(--neon)}
.ava-wrap{position:relative;flex-shrink:0}
.dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:#3a5a4a}
.dot.on{background:var(--neon);box-shadow:0 0 9px var(--neon)}
.my-card{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.my-card:active{background:var(--panel2)}
.my-card .nm{font-weight:800;font-size:14px}
.my-card .st{font-family:'JetBrains Mono';font-size:10px;color:var(--neon)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;display:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.empty .water{font-family:'Unbounded';font-weight:900;font-size:clamp(40px,15vw,80px);color:transparent;-webkit-text-stroke:1px var(--neon)}
.chat-head{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);flex-shrink:0}
.ch-info{flex:1;min-width:0;cursor:pointer}
.ch-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-status{font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut)}
.ch-status.on{color:var(--neon)}
.ch-status.typing{color:var(--neon2)}
.stack{display:flex;padding-left:4px}
.stack .ava{margin-left:-8px;border:2px solid var(--bg)}
.dots-menu{position:fixed;top:60px;right:14px;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:220px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.dots-menu button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border:0;background:none;color:var(--txt);font:600 13.5px 'Manrope';border-radius:9px;cursor:pointer;text-align:left}
.dots-menu button:active{background:var(--panel2)}
.dots-menu button.red{color:#ffb3c1}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.day-chip{align-self:center;font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);padding:3px 12px;border-radius:20px;margin:8px 0 4px}
.msg-row{display:flex;max-width:82%;animation:pop .18s ease}
.msg-row.mine{align-self:flex-end;flex-direction:row-reverse}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.bubble{padding:8px 12px 6px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);position:relative;line-height:1.4;max-width:100%}
.msg-row.theirs .bubble{border-bottom-left-radius:5px}
.msg-row.mine .bubble{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04140b;border:0;border-bottom-right-radius:5px}
.bubble.pinned{border:2px solid var(--neon)}
.bubble img.msg-img{max-width:240px;max-height:240px;border-radius:10px;margin:4px 0;cursor:pointer;display:block}
.bubble audio{max-width:220px;margin:4px 0}
.reply-box{background:rgba(0,0,0,.15);border-left:3px solid var(--neon);padding:4px 8px;margin-bottom:4px;border-radius:6px;font-size:12px;cursor:pointer}
.reply-box .rn{font-weight:700;font-size:11px}
.reply-box .rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.m-sender{font:600 11px 'JetBrains Mono';color:var(--neon2);margin-bottom:2px;cursor:pointer}
.m-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.m-edited{font-size:9px;opacity:.6;font-style:italic}
.m-time{font-family:'JetBrains Mono';font-size:9.5px;opacity:.55;text-align:right;margin-top:2px;display:flex;align-items:center;gap:3px;justify-content:flex-end}
.reads{font-size:10px}
.m-ava{margin-right:6px;cursor:pointer;align-self:flex-end}
.reactions{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.reaction{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px 6px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.reaction.mine{border-color:var(--neon);background:rgba(51,255,138,.15)}
.reaction .rc{font-size:10px;opacity:.7}
.composer{padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);flex-shrink:0}
.composer-note{font-size:12.5px;color:var(--danger);text-align:center;padding:8px;border:1px dashed #5a2233;border-radius:10px;margin-bottom:8px}
.reply-preview{background:var(--panel2);border-left:3px solid var(--neon);padding:8px 12px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.reply-preview .rp-body{flex:1;min-width:0}
.reply-preview .rp-name{font-weight:700;font-size:12px;color:var(--neon)}
.reply-preview .rp-text{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-preview .rp-close{cursor:pointer;font-size:18px;padding:4px}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;max-height:110px;font-size:15px}
.send-btn{width:46px;height:46px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04140b;font-size:19px;cursor:pointer;flex-shrink:0}
.send-btn:disabled{opacity:.35}
.attach-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:18px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(2,6,4,.75);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(460px,100%);max-height:90dvh;overflow-y:auto;padding:22px;position:relative}
.mclose{position:absolute;top:12px;right:12px}
.mtitle{font-family:'Unbounded';font-size:17px;font-weight:800;margin-bottom:14px;padding-right:40px}
.mlist{margin-top:10px;display:flex;flex-direction:column;gap:3px;max-height:340px;overflow-y:auto}
.mrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:11px;cursor:pointer}
.mrow:active{background:var(--panel2)}
.mrow .u{font-weight:800;font-size:13.5px}
.mrow .s{font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut)}
.mrow.check input{accent-color:var(--neon);width:17px;height:17px}
.pmodal{text-align:center}
.pava{position:relative;width:fit-content;margin:4px auto 10px}
.pava.edit{cursor:pointer}
.avaHint{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;font-weight:700}
.pava.edit:active .avaHint{opacity:1}
.pstat{position:absolute;right:2px;bottom:4px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);background:#3a5a4a}
.pstat.on{background:var(--neon)}
.pmodal h2{font-family:'Unbounded';font-size:18px}
.puser{font-family:'JetBrains Mono';color:var(--neon);font-size:12.5px;margin:2px 0}
.pstatus{font-family:'JetBrains Mono';font-size:11px;color:var(--mut);margin-bottom:8px}
.pabout{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font-size:13.5px;text-align:left}
.pmeta{font-size:10.5px;color:var(--mut);margin:8px 0}
.pbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pmodal .field{text-align:left}
.arow{display:flex;gap:8px;align-items:center;padding:9px;border-radius:11px;margin-bottom:5px;background:var(--panel2)}
.ainfo{flex:1;min-width:0}
.aname{font-weight:800;font-size:13.5px}
.amail{font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-on{color:var(--neon)}.st-off{color:var(--mut)}
.chip{font:600 9px 'JetBrains Mono';padding:2px 6px;border-radius:5px;vertical-align:2px;margin-left:3px}
.chip.adm{background:rgba(186,255,62,.15);color:var(--neon2);border:1px solid var(--neon2)}
.chip.mut{background:rgba(255,200,60,.12);color:#ffd35c}
.chip.ban{background:rgba(255,84,112,.12);color:#ff8ba0}
.abtns{display:flex;gap:4px;flex-shrink:0}
.hrow{display:flex;gap:8px;align-items:center;padding:9px;border-radius:10px;background:var(--panel2);margin-bottom:4px;font-size:13px;flex-wrap:wrap}
.htime{font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut);width:110px}
.ban-big{font-family:'Unbounded';font-weight:900;font-size:clamp(24px,7vw,40px);color:var(--danger);text-shadow:0 0 30px rgba(255,84,112,.5);margin-bottom:12px;animation:flick 3s infinite}
.toast-wrap{position:fixed;left:14px;right:14px;bottom:14px;z-index:100;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--neon);color:var(--txt);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;max-width:100%;pointer-events:auto;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateY(30px);opacity:0}}
.toast.err{border-color:var(--danger)}
.theme-btns{display:flex;gap:8px;justify-content:center;margin:10px 0}
.theme-btn{width:50px;height:50px;border-radius:12px;border:2px solid var(--line);cursor:pointer;font-size:11px;font-weight:700}
.theme-btn.active{border-color:var(--neon);box-shadow:0 0 12px var(--neon)}
.theme-btn.neon-t{background:linear-gradient(135deg,#04080a,#0a1611);color:#33ff8a}
.theme-btn.light-t{background:#f5f5f5;color:#222}
.theme-btn.blue-t{background:linear-gradient(135deg,#0a1628,#0f1f3d);color:#4da6ff}
.search-bar{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.search-result{padding:10px;border-radius:10px;cursor:pointer;margin-bottom:4px;background:var(--panel2)}
.search-result:active{background:var(--line)}
.search-result .sr-text{font-size:13px}
.search-result .sr-time{font-size:10px;color:var(--mut);font-family:'JetBrains Mono'}
.voice-rec{display:flex;align-items:center;gap:10px;padding:8px;background:#2a1218;border-radius:12px;margin-bottom:8px}
.voice-rec .rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.app.chat-open .sidebar{display:none}
.app.chat-open .main{display:flex}
</style>
</head>
<body>
<div class="bg-grid"></div><div class="glow g1"></div><div class="glow g2"></div>

<div class="screen" id="authScreen">
  <div class="auth-wrap">
    <div class="brand-big">GOLDA<b>MESSENGER</b></div>
    <div class="brand-sub">SECURE · REALTIME</div>
    <div class="panel auth-card">
      <div class="tabs">
        <button type="button" class="tab on" id="tabLogin">Вход</button>
        <button type="button" class="tab" id="tabReg">Регистрация</button>
      </div>
      <form id="loginForm" onsubmit="return false;">
        <div class="field"><label>Почта</label><input class="input" id="liEmail" type="email" required></div>
        <div class="field"><label>Пароль</label><input class="input" id="liPass" type="password" required></div>
        <button type="button" class="btn neon wide" id="liBtn">Войти →</button>
        <div class="form-err" id="liErr"></div>
      </form>
      <form id="regForm" class="hidden" onsubmit="return false;">
        <div class="field"><label>Почта</label><input class="input" id="rgEmail" type="email" required></div>
        <div class="field"><label>Пароль (мин. 6)</label><input class="input" id="rgPass" type="password" required minlength="6"></div>
        <div class="field"><label>Юзернейм</label><input class="input" id="rgUser" required maxlength="20"></div>
        <button type="button" class="btn neon wide" id="rgBtn">Создать ⚡</button>
        <div class="form-err" id="rgErr"></div><div class="form-ok" id="rgOk"></div>
      </form>
    </div>
  </div>
</div>

<div class="screen hidden" id="nameScreen">
  <div class="auth-wrap">
    <div class="brand-big">GOLDA<b>MESSENGER</b></div>
    <div class="panel auth-card">
      <form id="nameForm" onsubmit="return false;">
        <div class="field"><label>Юзернейм</label><input class="input" id="nmInput" maxlength="20" required></div>
        <button type="button" class="btn neon wide" id="nmBtn">Начать →</button>
        <div class="form-err" id="nmErr"></div>
      </form>
    </div>
  </div>
</div>

<div class="screen hidden" id="banScreen">
  <div class="auth-wrap" style="text-align:center">
    <div class="ban-big">ЗАБЛОКИРОВАНО</div>
    <button type="button" class="btn" id="banOut">Выйти</button>
  </div>
</div>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="logo">G<b>◆</b>LDA</div><div class="spacer"></div>
      <button type="button" class="ibtn" id="btnProfile">👤</button>
      <button type="button" class="ibtn hidden" id="btnAdmin">🛡️</button>
      <button type="button" class="ibtn" id="btnSearch">🔍</button>
      <button type="button" class="ibtn" id="btnLogout">🚪</button>
    </div>
    <div class="sb-actions">
      <button type="button" class="btn" id="btnNewChat">💬 Чат</button>
      <button type="button" class="btn" id="btnNewGroup">👥 Группа</button>
      <button type="button" class="btn" id="btnArchive">📦 Архив</button>
    </div>
    <div style="padding:0 14px 8px"><input class="input" id="sbSearch" placeholder="🔎 Поиск по чатам…"></div>
    <div class="sb-label"><span>ЧАТЫ</span><span id="archiveCount" class="dim hidden"></span></div>
    <div class="chat-list" id="chatList"></div>
    <div class="my-card" id="myCard">
      <span id="myAva"></span>
      <div style="flex:1;min-width:0"><div class="nm" id="myName"></div><div class="st">● в сети</div></div>
    </div>
  </aside>
  <main class="main">
    <div class="empty" id="emptyState">
      <div class="water">GOLDA</div>
      <div class="dim">Выбери чат</div>
    </div>
    <div id="chatView" class="hidden" style="display:none;flex-direction:column;height:100%">
      <div class="chat-head">
        <button type="button" class="ibtn" id="backBtn">←</button>
        <span id="chatAva"></span><span id="chatStack" class="stack"></span>
        <div class="ch-info" id="chInfo"><div class="ch-name" id="chName"></div><div class="ch-status" id="chStatus"></div></div>

$('#voiceCancel').onclick=()=>{if(voiceRecorder){voiceRecorder.stop();voiceRecorder=null;}clearInterval(voiceTimer);$('#voiceRec').classList.add('hidden');$('#msgInput').style.display='';$('#sendBtn').style.display='';$('#attachBtn').style.display='';voiceSeconds=0;};
$('#voiceSend').onclick=async()=>{if(!voiceRecorder)return;voiceRecorder.stop();voiceRecorder=null;clearInterval(voiceTimer);
  const blob=new Blob(voiceChunks,{type:'audio/webm'});const path=`${me.id}/voice_${Date.now()}.webm`;
  const{error}=await sb.storage.from('media').upload(path,blob,{contentType:'audio/webm'});
  if(error){toast('Ошибка: '+error.message,'err');return;}const{data}=sb.storage.from('media').getPublicUrl(path);const url=data.publicUrl+'?t='+Date.now();
  await sb.from('messages').insert({chat_id:currentChat.id,sender_id:me.id,text:null,voice_url:url,voice_duration:voiceSeconds});
  $('#voiceRec').classList.add('hidden');$('#msgInput').style.display='';$('#sendBtn').style.display='';$('#attachBtn').style.display='';voiceSeconds=0;toast('Голосовое отправлено 🎤');};

/* ══════════ АДМИНКА ══════════ */
$('#btnAdmin').onclick=async()=>{const{data:users,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});if(error)return toast('Нет доступа','err');
  const rows=users.map(u=>{const on=onlineIds.has(u.id);const adm=u.role==='admin';return`<div class="arow">${avatarHTML(u,38)}<div class="ainfo"><div class="aname">@${esc(u.username)}${adm?'<span class="chip adm">ADMIN</span>':''}${u.is_muted?'<span class="chip mut">MUTE</span>':''}${u.is_banned?'<span class="chip ban">BAN</span>':''}</div><div class="amail">${esc(u.email)} · <span class="${on?'st-on':'st-off'}">${on?'в сети':'не в сети'}</span></div></div><div class="abtns"><button type="button" class="btn small" data-act="mute" data-id="${u.id}" ${adm?'disabled':''}>${u.is_muted?'Снять':'🔇'}</button><button type="button" class="btn small ${u.is_banned?'':'danger'}" data-act="ban" data-id="${u.id}" ${adm?'disabled':''}>${u.is_banned?'Разбан':'⛔'}</button></div></div>`;});
  const hist=[...users].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(u=>`<div class="hrow"><span class="htime">${fmtDT(u.created_at)}</span><b>@${esc(u.username)}</b><span class="amail">${esc(u.email)}</span></div>`);
  openModal(`<h2 class="mtitle">🛡️ Админ-панель</h2><div class="tabs" style="margin-bottom:12px"><button type="button" class="tab on" id="adTab1">Юзеры (${users.length})</button><button type="button" class="tab" id="adTab2">📜 История</button></div><div id="adUsers">${rows.join('')}</div><div id="adHist" class="hidden">${hist.join('')}</div>`);
  $('#adTab1').onclick=()=>{$('#adTab1').classList.add('on');$('#adTab2').classList.remove('on');$('#adUsers').classList.remove('hidden');$('#adHist').classList.add('hidden');};
  $('#adTab2').onclick=()=>{$('#adTab2').classList.add('on');$('#adTab1').classList.remove('on');$('#adHist').classList.remove('hidden');$('#adUsers').classList.add('hidden');};
  $('#adUsers').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const u=users.find(x=>x.id===b.dataset.id);if(!u)return;
    if(b.dataset.act==='mute'){await sb.from('profiles').update({is_muted:!u.is_muted}).eq('id',u.id);toast(u.is_muted?`Снят: @${u.username}`:`Мут: @${u.username}`);}
    if(b.dataset.act==='ban'){await sb.from('profiles').update({is_banned:!u.is_banned}).eq('id',u.id);toast(u.is_banned?`Разбанен: @${u.username}`:`⛔ @${u.username} забанен`);}};};

sb.auth.onAuthStateChange(async(ev,session)=>{if(ev==='SIGNED_OUT'){cleanupToAuth();return;}if(session?.user)boot(session.user);});
sb.auth.getSession().then(({data:{session}})=>{if(session?.user)boot(session.user);else showScreen('authScreen');});
</script>
