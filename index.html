<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golda Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: '#00ff66',
                        neonDark: '#00cc52',
                        darkBg: '#0b0f0d',
                        panelBg: '#121815',
                        cardBg: '#1a2420'
                    }
                }
            }
        }
    </script>
    <style>
        .neon-border { border: 1px solid rgba(0, 255, 102, 0.4); }
        .neon-border:focus { border-color: #00ff66; outline: none; box-shadow: 0 0 10px rgba(0, 255, 102, 0.5); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f0d; }
        ::-webkit-scrollbar-thumb { background: #00ff6655; border-radius: 3px; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- АВТОРИЗАЦИЯ -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-darkBg/95 backdrop-blur-md">
        <div class="bg-panelBg p-8 rounded-2xl neon-border w-full max-w-md mx-4">
            <h1 class="text-3xl font-bold text-neon text-center mb-6">⚡ GOLDA MESSENGER</h1>
            
            <form id="auth-form" class="space-y-4">
                <div id="username-field" class="hidden">
                    <label class="block text-xs text-neon mb-1">Юзернейм</label>
                    <input type="text" id="username-input" class="w-full bg-darkBg text-gray-100 px-4 py-3 rounded-xl neon-border">
                </div>
                <div>
                    <label class="block text-xs text-neon mb-1">Email</label>
                    <input type="email" id="email-input" required class="w-full bg-darkBg text-gray-100 px-4 py-3 rounded-xl neon-border">
                </div>
                <div>
                    <label class="block text-xs text-neon mb-1">Пароль</label>
                    <input type="password" id="password-input" required class="w-full bg-darkBg text-gray-100 px-4 py-3 rounded-xl neon-border">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-neon text-darkBg font-bold py-3 rounded-xl hover:bg-neonDark transition">
                    Войти
                </button>
            </form>
            
            <button onclick="toggleAuthMode()" class="w-full text-center text-sm text-gray-400 hover:text-neon mt-4">
                Нет аккаунта? Зарегистрироваться
            </button>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app-screen" class="hidden flex h-full w-full">
        <!-- Сайдбар -->
        <div id="sidebar" class="w-full md:w-80 bg-panelBg border-r border-gray-800 flex flex-col">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img id="my-avatar" src="" class="w-10 h-10 rounded-full neon-border bg-darkBg">
                    <div>
                        <div class="flex items-center space-x-1">
                            <h3 id="my-username" class="font-bold text-neon text-sm">...</h3>
                            <span id="my-verified" class="hidden text-blue-400 text-xs"><i class="fa-solid fa-circle-check"></i></span>
                        </div>
                        <span class="text-xs text-gray-400">В сети</span>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button id="admin-btn" onclick="openAdmin()" class="hidden text-neon"><i class="fa-solid fa-shield-halved"></i></button>
                    <button onclick="openProfile()" class="text-gray-400 hover:text-neon"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>

            <div class="p-3">
                <input type="text" id="search-input" oninput="searchUsers()" placeholder="🔍 Поиск по юзернейму..." class="w-full bg-darkBg text-sm px-3 py-2 rounded-lg neon-border">
            </div>

            <div id="chats-list" class="flex-1 overflow-y-auto px-2 space-y-1"></div>

            <div class="p-3 border-t border-gray-800">
                <button onclick="logout()" class="w-full bg-red-950/30 text-red-400 border border-red-900/50 py-2 rounded-xl text-sm">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i>Выйти
                </button>
            </div>
        </div>

        <!-- Чат -->
        <div class="flex-1 flex flex-col bg-darkBg">
            <div id="no-chat" class="flex-1 flex flex-col items-center justify-center text-gray-500">
                <i class="fa-solid fa-comments text-6xl text-neon/20 mb-4"></i>
                <p>Найди пользователя через поиск</p>
            </div>

            <div id="chat-container" class="hidden flex-1 flex flex-col">
                <div class="p-4 bg-panelBg border-b border-gray-800 flex items-center space-x-3">
                    <img id="chat-avatar" src="" class="w-10 h-10 rounded-full neon-border bg-darkBg">
                    <div>
                        <h3 id="chat-name" class="font-bold"></h3>
                        <span id="chat-status" class="text-xs text-neon">в сети</span>
                    </div>
                </div>

                <div id="messages-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

                <form id="message-form" class="p-4 bg-panelBg border-t border-gray-800 flex space-x-3">
                    <input type="text" id="message-input" placeholder="Напишите сообщение..." class="flex-1 bg-darkBg px-4 py-3 rounded-xl neon-border">
                    <button type="submit" class="bg-neon text-darkBg px-5 py-3 rounded-xl font-bold">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-panelBg p-6 rounded-2xl neon-border w-full max-w-md mx-4">
            <button onclick="closeProfile()" class="float-right text-gray-400 hover:text-neon"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 class="text-xl font-bold text-neon mb-4">Профиль</h2>
            <div class="space-y-4">
                <img id="edit-avatar" src="" class="w-20 h-20 rounded-full neon-border mx-auto bg-darkBg">
                <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatar(event)">
                <button onclick="document.getElementById('avatar-input').click()" class="w-full bg-cardBg text-neon py-2 rounded-xl text-sm">
                    <i class="fa-solid fa-image mr-2"></i>Сменить аватар
                </button>
                <input type="text" id="edit-username" placeholder="Юзернейм" class="w-full bg-darkBg px-3 py-2 rounded-lg neon-border">
                <textarea id="edit-bio" placeholder="О себе" rows="3" class="w-full bg-darkBg px-3 py-2 rounded-lg neon-border"></textarea>
                <button onclick="saveProfile()" class="w-full bg-neon text-darkBg font-bold py-2 rounded-xl">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dbyuboaxorfudywmlrvi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hG8WV5dG4gMpUu7zN4-ntQ_T1dYrFXJ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let myProfile = null;
        let currentChat = null;
        let isRegister = false;

        // Загрузка
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                currentUser = session.user;
                await loadProfile();
                showApp();
            } else {
                showAuth();
            }
        });

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('flex');
            
            document.getElementById('my-avatar').src = myProfile.avatar_url || '';
            document.getElementById('my-username').textContent = '@' + myProfile.username;
            
            if (myProfile.is_verified) {
                document.getElementById('my-verified').classList.remove('hidden');
            }

            if (myProfile.role === 'admin' || myProfile.email?.toLowerCase() === 'levshlapa919@gmail.com') {
                document.getElementById('admin-btn').classList.remove('hidden');
            }

            loadChats();
            setupRealtime();
        }

        // Авторизация
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (isRegister) {
                const username = document.getElementById('username-input').value.trim();
                if (!username) return alert('Введите юзернейм');

                const { data, error } = await db.auth.signUp({ email, password });
                if (error) return alert('Ошибка: ' + error.message);

                currentUser = data.user;
                await db.from('profiles').insert({
                    id: currentUser.id,
                    username: username,
                    email: email,
                    role: username.toLowerCase() === 'golda_mesenger' ? 'admin' : 'user',
                    is_verified: username.toLowerCase() === 'golda_mesenger'
                });

                alert('Регистрация успешна!');
                location.reload();
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) return alert('Ошибка входа: ' + error.message);
                location.reload();
            }
        });

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-btn').textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('username-field').classList.toggle('hidden', !isRegister);
        }

        async function loadProfile() {
            const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
            if (!data) {
                const username = currentUser.email.split('@')[0];
                const { data: newProf } = await db.from('profiles').insert({
                    id: currentUser.id,
                    username: username,
                    email: currentUser.email
                }).select().single();
                myProfile = newProf;
            } else {
                myProfile = data;
            }
        }

        // Поиск пользователей
        async function searchUsers() {
            const query = document.getElementById('search-input').value.trim();
            const list = document.getElementById('chats-list');
            list.innerHTML = '';

            if (!query) return;

            const { data: users } = await db.from('profiles')
                .select('*')
                .neq('id', currentUser.id)
                .ilike('username', `%${query}%`)
                .limit(20);

            if (users) {
                users.forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'p-3 rounded-xl cursor-pointer flex items-center space-x-3 hover:bg-cardBg transition';
                    div.onclick = () => openChat(u);
                    div.innerHTML = `
                        <img src="${u.avatar_url || ''}" class="w-11 h-11 rounded-full neon-border bg-darkBg">
                        <div class="flex-1">
                            <div class="flex items-center space-x-1">
                                <h4 class="font-bold text-sm">@${u.username}</h4>
                                ${u.is_verified ? '<span class="text-blue-400 text-xs"><i class="fa-solid fa-circle-check"></i></span>' : ''}
                            </div>
                            <p class="text-xs text-gray-400">${u.status || 'офлайн'}</p>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
        }

        // Открыть чат
        async function openChat(user) {
            currentChat = { type: 'user', id: user.id, name: user.username, avatar: user.avatar_url };
            
            document.getElementById('no-chat').classList.add('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            document.getElementById('chat-avatar').src = user.avatar_url || '';
            document.getElementById('chat-name').textContent = '@' + user.username;
            
            await loadMessages();
        }

        // Загрузка сообщений
        async function loadMessages() {
            if (!currentChat) return;
            
            const list = document.getElementById('messages-list');
            list.innerHTML = '<div class="text-center text-gray-500 p-4">Загрузка...</div>';

            let query = db.from('messages').select('*').order('created_at', { ascending: true });

            if (currentChat.type === 'user') {
                query = query.or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentChat.id}`)
                    .or(`sender_id.eq.${currentChat.id},receiver_id.eq.${currentUser.id}`);
            }

            const { data, error } = await query;

            if (error) {
                console.error(error);
                list.innerHTML = '<div class="text-center text-red-400 p-4">Ошибка загрузки</div>';
                return;
            }

            list.innerHTML = '';

            if (data && data.length > 0) {
                const senderIds = [...new Set(data.map(m => m.sender_id))];
                const { data: profiles } = await db.from('profiles').select('id, username, avatar_url').in('id', senderIds);
                const profilesMap = {};
                if (profiles) profiles.forEach(p => profilesMap[p.id] = p);

                data.forEach(msg => {
                    const isMe = msg.sender_id === currentUser.id;
                    const sender = profilesMap[msg.sender_id];
                    
                    const div = document.createElement('div');
                    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-3`;
                    div.innerHTML = `
                        <div class="max-w-[70%] ${isMe ? 'bg-cardBg border border-neon/30' : 'bg-panelBg'} rounded-2xl p-3">
                            ${!isMe && sender ? `<div class="text-xs text-neon font-bold mb-1">@${sender.username}</div>` : ''}
                            <p class="text-sm break-words">${msg.content}</p>
                        </div>
                    `;
                    list.appendChild(div);
                });

                list.scrollTop = list.scrollHeight;
            } else {
                list.innerHTML = '<div class="text-center text-gray-500 p-4">Нет сообщений</div>';
            }
        }

        // Отправка сообщения
        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            
            if (!content || !currentChat) return;

            const { error } = await db.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChat.id,
                content: content
            });

            if (error) {
                console.error(error);
                alert('Ошибка отправки: ' + error.message);
            } else {
                input.value = '';
                await loadMessages();
            }
        });

        // Realtime
        function setupRealtime() {
            db.channel('messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if (currentChat && (payload.new.sender_id === currentChat.id || payload.new.receiver_id === currentChat.id)) {
                        loadMessages();
                    }
                })
                .subscribe();
        }

        // Профиль
        function openProfile() {
            document.getElementById('edit-avatar').src = myProfile.avatar_url || '';
            document.getElementById('edit-username').value = myProfile.username;
            document.getElementById('edit-bio').value = myProfile.bio || '';
            document.getElementById('profile-modal').classList.remove('hidden');
            document.getElementById('profile-modal').classList.add('flex');
        }

        function closeProfile() {
            document.getElementById('profile-modal').classList.add('hidden');
            document.getElementById('profile-modal').classList.remove('flex');
        }

        function handleAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('edit-avatar').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function saveProfile() {
            const username = document.getElementById('edit-username').value.trim();
            const bio = document.getElementById('edit-bio').value;
            const avatar_url = document.getElementById('edit-avatar').src;

            const { error } = await db.from('profiles').update({ username, bio, avatar_url }).eq('id', currentUser.id);
            
            if (error) {
                alert('Ошибка: ' + error.message);
            } else {
                alert('Сохранено!');
                location.reload();
            }
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        function loadChats() {
            // Пустой список чатов по умолчанию
            document.getElementById('chats-list').innerHTML = '<div class="p-4 text-center text-gray-500 text-xs">Используй поиск для нахождения пользователей</div>';
        }

        function openAdmin() {
            alert('Админ панель - в разработке');
        }
    </script>
</body>
</html>
